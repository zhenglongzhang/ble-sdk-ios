<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WebView Target</title>
  <style>
    :root {
      --bg: #f8f4e8;
      --ink: #211b14;
      --muted: #766a5c;
      --brand: #9f6b1f;
      --card: #fffdf7;
      --line: #eee3cd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 0%, rgba(159, 107, 31, 0.2), transparent 32%),
        linear-gradient(145deg, #fffdf7 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      padding: 26px 18px;
    }
    h1 {
      font-size: 30px;
      letter-spacing: -0.04em;
      line-height: 1.08;
      margin: 0 0 10px;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 16px;
    }
    .card {
      background: rgba(255, 253, 247, 0.95);
      border: 1px solid var(--line);
      border-radius: 22px;
      margin-top: 16px;
      padding: 16px;
    }
    button {
      appearance: none;
      background: var(--brand);
      border: 0;
      border-radius: 16px;
      color: white;
      font: inherit;
      font-weight: 900;
      min-height: 48px;
      padding: 12px 14px;
      width: 100%;
    }
    pre {
      background: #20170f;
      border-radius: 16px;
      color: #ffe0b7;
      font-size: 12px;
      line-height: 1.5;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>新 WebView 打开成功</h1>
  <p>这是 `openWebView` 打开的本地测试页。这个页面也会注入 `ZnhaasAppBridge`，可以继续调用网络状态等原生能力。</p>

  <section class="card">
    <button onclick="checkNetwork()">在新 WebView 中获取网络状态</button>
    <pre id="output">等待操作...</pre>
  </section>

  <script>
    window.ZnhaasApp = window.ZnhaasApp || {};
    window.ZnhaasApp.onNativeEvent = event => {
      document.getElementById('output').textContent = JSON.stringify(event, null, 2);
    };
    window.addEventListener('ZnhaasAppEvent', event => {
      document.getElementById('output').textContent = JSON.stringify(event.detail, null, 2);
    });

    function bridge() {
      return window.__ZnhaasAppBridgeFacade || window.ZnhaasAppBridge;
    }

    function checkNetwork() {
      if (!bridge()) {
        document.getElementById('output').textContent = 'ZnhaasAppBridge not ready.';
        return;
      }
      const result = bridge().getNetworkState();
      document.getElementById('output').textContent = '已发起网络状态请求：\n' + result;
    }
  </script>
</body>
</html>
