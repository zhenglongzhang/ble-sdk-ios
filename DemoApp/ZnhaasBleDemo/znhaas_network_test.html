<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Network Test</title>
  <style>
    :root {
      --bg: #eef4ec;
      --card: #ffffff;
      --ink: #162417;
      --muted: #687768;
      --brand: #21824b;
      --line: #dbe7db;
      --log-bg: #101910;
      --log: #c7f4c8;
      --shadow: 0 16px 36px rgba(36, 76, 47, 0.14);
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(33, 130, 75, 0.18), transparent 34%),
        linear-gradient(150deg, #fbfff8 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      overscroll-behavior: none;
      padding: calc(20px + env(safe-area-inset-top)) 15px calc(32px + env(safe-area-inset-bottom));
    }
    a { color: var(--brand); text-decoration: none; font-weight: 800; }
    a, button { -webkit-tap-highlight-color: transparent; }
    h1 { font-size: 30px; margin: 14px 0 8px; letter-spacing: -0.04em; }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 16px; }
    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin: 14px 0;
      padding: 16px;
    }
    button {
      appearance: none;
      background: var(--brand);
      border: 0;
      border-radius: 16px;
      color: white;
      font: inherit;
      font-weight: 900;
      min-height: 48px;
      padding: 12px 14px;
      width: 100%;
    }
    .result {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
      margin-top: 14px;
    }
    .row {
      background: #f6fbf5;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px;
    }
    .row span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .row strong {
      display: block;
      font-size: 16px;
      line-height: 1.45;
      word-break: break-all;
    }
    .log {
      background: var(--log-bg);
      border-radius: 18px;
      color: var(--log);
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.5;
      max-height: 310px;
      min-height: 220px;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <a href="znhaas_app_tests.html">返回测试入口</a>
  <h1>有网无网判断测试</h1>
  <p class="subtitle">点击按钮调用 `window.ZnhaasAppBridge.getNetworkState()`，iOS 会先返回 requestId，并通过 `networkState` 事件返回真实网络状态。</p>

  <section class="card">
    <button onclick="checkNetwork()">获取网络状态</button>
    <div class="result">
      <div class="row"><span>connected</span><strong id="connected">-</strong></div>
      <div class="row"><span>type</span><strong id="type">-</strong></div>
      <div class="row"><span>validated</span><strong id="validated">-</strong></div>
      <div class="row"><span>metered</span><strong id="metered">-</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="log" id="log"></div>
  </section>

  <script>
    window.ZnhaasApp = window.ZnhaasApp || {};
    window.ZnhaasApp.onNativeEvent = handleNativeEvent;
    window.addEventListener('ZnhaasAppEvent', event => handleNativeEvent(event.detail));

    function bridge() {
      return window.__ZnhaasAppBridgeFacade || window.ZnhaasAppBridge;
    }

    function checkNetwork() {
      if (!bridge()) {
        log('ZnhaasAppBridge not ready. 请在 iOS Demo WKWebView 中打开。');
        return;
      }
      const result = bridge().getNetworkState();
      if (result && typeof result === 'object') {
        log('sync result=' + JSON.stringify(result));
        render(result);
      } else {
        log('getNetworkState requestId=' + result);
      }
    }

    function handleNativeEvent(event) {
      if (!event || !event.type) {
        return;
      }
      log(JSON.stringify(event, null, 2));
      if (event.type === 'networkState') {
        render(event.data || {});
      }
    }

    function render(data) {
      setText('connected', String(!!data.connected));
      setText('type', data.type || 'none');
      setText('validated', String(!!data.validated));
      setText('metered', String(!!data.metered));
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function log(message) {
      const node = document.getElementById('log');
      node.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message + '\n' + node.textContent;
    }

    log('Network test ready.');
  </script>
</body>
</html>
