<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Take Photo Test</title>
  <style>
    :root {
      --bg: #f6f1ea;
      --card: #fffefa;
      --ink: #2c2118;
      --muted: #7b6e61;
      --brand: #ba5a1c;
      --line: #eadfd3;
      --log-bg: #1c1510;
      --log: #ffe0b7;
      --shadow: 0 16px 36px rgba(76, 45, 22, 0.13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(186, 90, 28, 0.18), transparent 34%),
        linear-gradient(150deg, #fffdf8 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      padding: 20px 15px 32px;
    }
    a { color: var(--brand); text-decoration: none; font-weight: 800; }
    h1 { font-size: 30px; margin: 14px 0 8px; letter-spacing: -0.04em; }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 16px; }
    .card {
      background: rgba(255, 254, 250, 0.94);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin: 14px 0;
      padding: 16px;
    }
    button {
      appearance: none;
      background: var(--brand);
      border: 0;
      border-radius: 16px;
      color: white;
      font: inherit;
      font-weight: 900;
      min-height: 48px;
      padding: 12px 14px;
      width: 100%;
    }
    .preview {
      background: #f8efe5;
      border: 1px dashed var(--line);
      border-radius: 18px;
      margin-top: 14px;
      min-height: 180px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
    }
    .preview img {
      display: block;
      max-width: 100%;
      width: 100%;
      height: auto;
    }
    .result {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .row {
      background: #fff8f0;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px;
    }
    .row span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .row strong {
      display: block;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-all;
    }
    .log {
      background: var(--log-bg);
      border-radius: 18px;
      color: var(--log);
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.5;
      max-height: 310px;
      min-height: 220px;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <a href="znhaas_app_tests.html">返回测试入口</a>
  <h1>拍照能力测试</h1>
  <p class="subtitle">点击按钮调用 `window.ZnhaasAppBridge.takePhoto()`，原生拍照完成后返回压缩 JPEG 的 base64/dataUrl，H5 可自行上传。</p>

  <section class="card">
    <button onclick="takePhoto()">拉起拍照</button>
    <div class="preview" id="preview">拍照成功后这里会显示图片预览</div>
    <div class="result">
      <div class="row"><span>requestId</span><strong id="requestId">-</strong></div>
      <div class="row"><span>fileName</span><strong id="fileName">-</strong></div>
      <div class="row"><span>mimeType</span><strong id="mimeType">-</strong></div>
      <div class="row"><span>width x height</span><strong id="size">-</strong></div>
      <div class="row"><span>sizeBytes</span><strong id="sizeBytes">-</strong></div>
      <div class="row"><span>base64 length</span><strong id="base64Length">-</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="log" id="log"></div>
  </section>

  <script>
    window.ZnhaasApp = window.ZnhaasApp || {};
    window.ZnhaasApp.onNativeEvent = handleNativeEvent;
    window.addEventListener('ZnhaasAppEvent', event => handleNativeEvent(event.detail));

    function bridge() {
      return window.__ZnhaasAppBridgeFacade || window.ZnhaasAppBridge;
    }

    function takePhoto() {
      if (!bridge()) {
        log('ZnhaasAppBridge not ready. 请在 iOS Demo WKWebView 中打开。');
        return;
      }
      const requestId = bridge().takePhoto({
        maxWidth: 1600,
        quality: 80,
        source: 'photo-test'
      });
      setText('requestId', requestId || '-');
      log('takePhoto requestId=' + requestId);
    }

    function handleNativeEvent(event) {
      if (!event || !event.type) {
        return;
      }
      const safe = JSON.parse(JSON.stringify(event));
      if (safe.data && safe.data.image && safe.data.image.base64) {
        safe.data.image.base64 = '[base64 length=' + safe.data.image.base64.length + ']';
        safe.data.image.dataUrl = '[dataUrl length=' + (event.data.image.dataUrl || '').length + ']';
      }
      log(JSON.stringify(safe, null, 2));
      if (event.type === 'takePhotoError') {
        setText('fileName', event.data && event.data.message ? event.data.message : '拍照失败');
        return;
      }
      if (event.type !== 'takePhotoResult') {
        return;
      }
      const data = event.data || {};
      if (data.cancelled) {
        setText('fileName', '用户取消');
        return;
      }
      const image = data.image || {};
      setText('requestId', data.requestId || '-');
      setText('fileName', image.fileName || '-');
      setText('mimeType', image.mimeType || '-');
      setText('size', (image.width || '-') + ' x ' + (image.height || '-'));
      setText('sizeBytes', String(image.sizeBytes || '-'));
      setText('base64Length', String((image.base64 || '').length));
      if (image.dataUrl) {
        document.getElementById('preview').innerHTML = '<img alt="photo preview" src="' + image.dataUrl + '">';
      }
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function log(message) {
      const node = document.getElementById('log');
      node.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message + '\n' + node.textContent;
    }

    log('Take photo test ready.');
  </script>
</body>
</html>
