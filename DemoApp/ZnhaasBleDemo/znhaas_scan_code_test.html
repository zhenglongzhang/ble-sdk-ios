<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scan Code Test</title>
  <style>
    :root {
      --bg: #edf4f8;
      --card: #ffffff;
      --ink: #152534;
      --muted: #66798b;
      --brand: #0b73d9;
      --line: #d9e6ef;
      --log-bg: #0f1720;
      --log: #b6f2d0;
      --shadow: 0 16px 36px rgba(15, 49, 77, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(11, 115, 217, 0.18), transparent 34%),
        linear-gradient(150deg, #fbfdff 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      padding: 20px 15px 32px;
    }
    a { color: var(--brand); text-decoration: none; font-weight: 800; }
    h1 { font-size: 30px; margin: 14px 0 8px; letter-spacing: -0.04em; }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 16px; }
    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin: 14px 0;
      padding: 16px;
    }
    button {
      appearance: none;
      background: var(--brand);
      border: 0;
      border-radius: 16px;
      color: white;
      font: inherit;
      font-weight: 900;
      min-height: 48px;
      padding: 12px 14px;
      width: 100%;
    }
    .result {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .row {
      background: #f6faff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px;
    }
    .row span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .row strong {
      display: block;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-all;
    }
    .log {
      background: var(--log-bg);
      border-radius: 18px;
      color: var(--log);
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.5;
      max-height: 310px;
      min-height: 220px;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <a href="znhaas_app_tests.html">返回测试入口</a>
  <h1>扫码能力测试</h1>
  <p class="subtitle">点击按钮调用 `window.ZnhaasAppBridge.scanCode()`，原生扫码完成后通过 `scanCodeResult` 返回。</p>

  <section class="card">
    <button onclick="startScan()">拉起扫码</button>
    <div class="result">
      <div class="row"><span>requestId</span><strong id="requestId">-</strong></div>
      <div class="row"><span>text</span><strong id="text">-</strong></div>
      <div class="row"><span>format</span><strong id="format">-</strong></div>
      <div class="row"><span>cancelled</span><strong id="cancelled">-</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="log" id="log"></div>
  </section>

  <script>
    window.ZnhaasApp = window.ZnhaasApp || {};
    window.ZnhaasApp.onNativeEvent = handleNativeEvent;
    window.addEventListener('ZnhaasAppEvent', event => handleNativeEvent(event.detail));

    function bridge() {
      return window.__ZnhaasAppBridgeFacade || window.ZnhaasAppBridge;
    }

    function startScan() {
      if (!bridge()) {
        log('ZnhaasAppBridge not ready. 请在 iOS Demo WKWebView 中打开。');
        return;
      }
      const requestId = bridge().scanCode({ source: 'scan-test' });
      setText('requestId', requestId || '-');
      log('scanCode requestId=' + requestId);
    }

    function handleNativeEvent(event) {
      if (!event || !event.type) {
        return;
      }
      log(JSON.stringify(event, null, 2));
      if (event.type !== 'scanCodeResult') {
        return;
      }
      const data = event.data || {};
      setText('requestId', data.requestId || '-');
      setText('text', data.text || '-');
      setText('format', data.format || '-');
      setText('cancelled', String(!!data.cancelled));
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function log(message) {
      const node = document.getElementById('log');
      node.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message + '\n' + node.textContent;
    }

    log('Scan code test ready.');
  </script>
</body>
</html>
