<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Znhaas BLE iOS H5 Demo</title>
  <style>
    :root {
      --bg: #eef3f7;
      --card: #ffffff;
      --ink: #172333;
      --muted: #667587;
      --line: #dbe5ee;
      --brand: #1768e8;
      --brand-2: #0f9f8f;
      --danger: #d9534f;
      --log-bg: #101720;
      --log-text: #b8f3c8;
      --shadow: 0 18px 42px rgba(31, 49, 71, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(23, 104, 232, 0.18), transparent 30%),
        linear-gradient(160deg, #f7fbff 0%, var(--bg) 50%, #e8f7f4 100%);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      overscroll-behavior: none;
      padding: calc(22px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    }

    a,
    button {
      -webkit-tap-highlight-color: transparent;
    }

    .back-link {
      align-items: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(31, 49, 71, 0.09);
      color: var(--brand);
      display: inline-flex;
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 16px;
      padding: 9px 13px;
      text-decoration: none;
    }

    .hero {
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--brand-2);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 8px;
      font-size: 30px;
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(219, 229, 238, 0.9);
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin: 14px 0;
      padding: 16px;
      backdrop-filter: blur(16px);
    }

    .card-title {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-title h2 {
      font-size: 18px;
      margin: 0;
    }

    .pill {
      border-radius: 999px;
      background: #edf7ff;
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
    }

    .grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .field-stack {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field-row {
      display: grid;
      gap: 10px;
      grid-template-columns: 0.78fr 1.22fr;
    }

    .field {
      background: #f8fbff;
      border: 1px solid var(--line);
      border-radius: 16px;
      display: grid;
      gap: 7px;
      padding: 11px 12px;
    }

    .field span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      outline: none;
      padding: 0;
    }

    .field input::placeholder {
      color: #9aa9b8;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 15px;
      background: var(--brand);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      min-height: 46px;
      padding: 11px 12px;
      box-shadow: 0 8px 18px rgba(23, 104, 232, 0.22);
    }

    button.secondary {
      background: #eaf2ff;
      color: var(--brand);
      box-shadow: none;
    }

    button.green {
      background: var(--brand-2);
      box-shadow: 0 8px 18px rgba(15, 159, 143, 0.2);
    }

    button.danger {
      background: #fff0f0;
      color: var(--danger);
      box-shadow: none;
    }

    .status {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }

    .status-item {
      background: #f6f9fc;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
    }

    .status-item span {
      color: var(--muted);
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .status-item strong {
      font-size: 14px;
    }

    .device-list {
      display: grid;
      gap: 10px;
      min-height: 96px;
    }

    .empty {
      align-items: center;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      display: flex;
      justify-content: center;
      min-height: 96px;
      text-align: center;
    }

    .device {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f8fbff;
      padding: 13px;
    }

    .device strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .device small {
      color: var(--muted);
      display: block;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-all;
    }

    .log {
      background: var(--log-bg);
      border-radius: 18px;
      color: var(--log-text);
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.5;
      max-height: 270px;
      min-height: 210px;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 390px) {
      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        font-size: 26px;
      }

      .grid,
      .field-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <a class="back-link" href="znhaas_app_tests.html">返回测试入口</a>

  <section class="hero">
    <div class="eyebrow">Znhaas BLE JSBridge</div>
    <h1>H5 控制蓝牙安全帽</h1>
    <p class="subtitle">页面通过 iOS WKWebView JSBridge 调用原生 BLE SDK，支持扫描、连接、v2 录像控制和设备回复监听。</p>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>状态</h2>
      <span class="pill" id="bridgeState">Bridge checking</span>
    </div>
    <div class="status">
      <div class="status-item"><span>蓝牙</span><strong id="bluetoothStatus">-</strong></div>
      <div class="status-item"><span>权限</span><strong id="permissionStatus">-</strong></div>
      <div class="status-item"><span>扫描</span><strong id="scanStatus">-</strong></div>
      <div class="status-item"><span>连接</span><strong id="connectStatus">-</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>操作</h2>
      <span class="pill">znhaas only</span>
    </div>
    <div class="grid">
      <button onclick="requestPermissions()">检查权限</button>
      <button class="secondary" onclick="enableBluetooth()">开启蓝牙</button>
      <button class="green" onclick="startScan()">开始扫描</button>
      <button class="secondary" onclick="stopScan()">停止扫描</button>
      <button class="danger" onclick="disconnect()">断开连接</button>
      <button class="secondary" onclick="refreshState()">刷新状态</button>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>设备列表</h2>
      <span class="pill" id="deviceCount">0 台</span>
    </div>
    <div class="device-list" id="devices">
      <div class="empty">点击开始扫描，发现 znhaas_23070401 这类设备后点卡片连接</div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>录像控制</h2>
      <span class="pill">Protocol v2</span>
    </div>
    <div class="field-stack">
      <div class="field-row">
        <label class="field">
          <span>工单号 work_order</span>
          <input id="workOrder" type="text" inputmode="text" autocomplete="off" placeholder="WO-20250122">
        </label>
        <label class="field">
          <span>任务号 task_id</span>
          <input id="taskId" type="text" inputmode="text" autocomplete="off" placeholder="TASK-01">
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span>设备ID device_id</span>
          <input id="deviceId" type="text" inputmode="text" autocomplete="off" placeholder="31011500991325140052">
        </label>
      </div>
    </div>
    <div class="grid">
      <button onclick="callCommand('disableVideoKey')">开始录制+禁用物理键</button>
      <button onclick="callCommand('enableVideoKey')">开始录制+启用物理键</button>
      <button onclick="callCommand('stopRecord')">停止录制</button>
      <button onclick="callCommand('queryRecordStatus')">查询状态</button>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>Runtime Log</h2>
      <button class="secondary" onclick="clearLog()">清空</button>
    </div>
    <div class="log" id="log"></div>
  </section>

  <script>
    const state = {
      devices: new Map(),
      bridgeReady: false,
    };

    window.ZnhaasBle = {
      __dispatch(payload) {
        const event = typeof payload === 'string' ? JSON.parse(payload) : payload;
        window.dispatchEvent(new CustomEvent('ZnhaasBleEvent', { detail: event }));
        if (typeof window.ZnhaasBle.onNativeEvent === 'function') {
          window.ZnhaasBle.onNativeEvent(event);
        }
      },
      onNativeEvent(event) {
        handleNativeEvent(event);
      }
    };

    function bridge() {
      return window.ZnhaasBleBridge;
    }

    function ensureBridge() {
      if (!bridge()) {
        log('JSBridge not ready. 请确认在 iOS WKWebView 中打开。');
        return false;
      }
      return true;
    }

    function requestPermissions() {
      if (!ensureBridge()) return;
      bridge().requestPermissions();
    }

    function enableBluetooth() {
      if (!ensureBridge()) return;
      bridge().requestEnableBluetooth();
    }

    function startScan() {
      if (!ensureBridge()) return;
      state.devices.clear();
      renderDevices();
      bridge().startScan(12000);
    }

    function stopScan() {
      if (!ensureBridge()) return;
      bridge().stopScan();
    }

    function disconnect() {
      if (!ensureBridge()) return;
      bridge().disconnect();
    }

    function refreshState() {
      if (!ensureBridge()) return;
      const requestId = bridge().getState();
      log('State requested: ' + requestId);
    }

    function connect(identifier) {
      if (!ensureBridge()) return;
      bridge().connect(identifier);
    }

    function callCommand(method) {
      if (!ensureBridge()) return;
      const extras = getCommandExtras();
      const requestId = bridge()[method](extras);
      log(method + ' dispatched, callbackId=' + requestId + formatCommandExtras(extras));
    }

    function getCommandExtras() {
      const extras = {};
      collectFixedField(extras, 'work_order', 'workOrder');
      collectFixedField(extras, 'task_id', 'taskId');
      collectFixedField(extras, 'device_id', 'deviceId');
      return extras;
    }

    function collectFixedField(extras, key, inputId) {
      const value = getInputValue(inputId);
      if (value) {
        extras[key] = value;
      }
    }

    function getInputValue(id) {
      const input = document.getElementById(id);
      return input ? input.value.trim() : '';
    }

    function formatCommandExtras(extras) {
      const parts = Object.entries(extras).map(([key, value]) => key + '=' + value);
      return parts.length ? ', ' + parts.join(', ') : '';
    }

    function handleNativeEvent(event) {
      const type = event.type;
      const data = event.data || {};
      if (type === 'state' || type === 'bluetoothStateChanged' || type === 'permissionsResult' || type === 'enableBluetoothResult') {
        log(type + ' ' + JSON.stringify(data));
        updateState(data);
      }
      if (type === 'enableBluetoothResult' && data.message) {
        log((data.success ? '开启蓝牙成功: ' : '开启蓝牙失败: ') + data.message);
      }
      if (type === 'scanStarted') {
        setText('scanStatus', '扫描中');
        log('Scan started');
      }
      if (type === 'deviceFound' && data.device) {
        state.devices.set(data.device.address, data.device);
        renderDevices();
        log('Found: ' + data.device.displayName + ' / ' + data.device.address);
      }
      if (type === 'scanStopped') {
        setText('scanStatus', '已停止');
        log('Scan stopped, count=' + (data.count || 0));
      }
      if (type === 'deviceConnecting') {
        setText('connectStatus', '连接中');
        log('Connecting: ' + formatDevice(data.device));
      }
      if (type === 'deviceConnected') {
        setText('connectStatus', '已连接');
        log('Connected: ' + formatDevice(data.device));
      }
      if (type === 'deviceReady') {
        setText('connectStatus', '就绪');
        log('Device ready: ' + formatDevice(data.device));
      }
      if (type === 'deviceDisconnected') {
        setText('connectStatus', '未连接');
        log('Disconnected');
      }
      if (type === 'replyListenerEnabled') {
        log('Reply listener enabled: ' + data.characteristicUuid);
      }
      if (type === 'writeSuccess') {
        log('Write success: ' + data.value);
      }
      if (type === 'deviceAck') {
        log('Device response: ' + data.value);
        if (data.response) {
          log('V2 Response: ' + formatV2Response(data.response));
        }
      }
      if (type === 'deviceReply') {
        const prefix = data.isReadFallback ? 'Read fallback value (not ACK): ' : 'Device reply: ';
        log(prefix + data.value);
      }
      if (type === 'error' || type === 'connectionError' || type === 'writeError' || type === 'replyChannelError') {
        log('Error [' + type + ']: ' + (data.message || JSON.stringify(data)));
      }
      if (type === 'commandDispatched') {
        log('Command dispatched: ' + data.action + ', requestId=' + data.requestId + ', command=' + data.command);
      }
      if (type === 'log') {
        log(data.message || '');
      }
    }

    function updateState(data) {
      setText('bluetoothStatus', data.bluetoothStatusText || (data.bluetoothEnabled ? '已开启' : (data.bluetoothChecking ? '检查中' : '未开启')));
      setText('permissionStatus', data.bluetoothAuthorizationText || (data.hasRequiredPermissions ? '已授权' : '未授权'));
      setText('scanStatus', data.scanning ? '扫描中' : '已停止');
      setText('connectStatus', data.connected ? '已连接' : '未连接');
    }

    function renderDevices() {
      const root = document.getElementById('devices');
      const list = Array.from(state.devices.values());
      setText('deviceCount', list.length + ' 台');
      if (!list.length) {
        root.innerHTML = '<div class="empty">点击开始扫描，发现 znhaas_******* 这类设备后点卡片连接</div>';
        return;
      }
      root.innerHTML = list.map(device => `
        <div class="device" data-identifier="${escapeHtml(device.identifier || device.address || '')}" onclick="connect(this.dataset.identifier)">
          <strong>${escapeHtml(device.displayName || device.name || 'Unknown')}</strong>
          <small>${escapeHtml(device.name || '')} | ${escapeHtml(device.identifier || device.address || '')}</small>
          <small>RSSI: ${device.rssi} dBm</small>
        </div>
      `).join('');
    }

    function formatDevice(device) {
      if (!device) return '-';
      return (device.displayName || device.name || '-') + ' / ' + (device.identifier || device.address || '-');
    }

    function formatV2Response(response) {
      const parts = [
        response.actionText || response.action,
        response.success ? 'SUCCESS' : (response.statusText || response.statusCode),
        response.requestId || '',
      ];
      if (response.filePath) parts.push('filePath=' + response.filePath);
      if (response.bucketName) parts.push('bucket=' + response.bucketName);
      if (response.recordingState) parts.push('recordingState=' + response.recordingState);
      if (response.battery) parts.push('battery=' + response.battery);
      if (response.rssi) parts.push('rssi=' + response.rssi);
      return parts.filter(Boolean).join(', ');
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function log(message) {
      const root = document.getElementById('log');
      const now = new Date();
      const time = now.toTimeString().slice(0, 8);
      root.textContent += `[${time}] ${message}\n`;
      root.scrollTop = root.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').textContent = '';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      state.bridgeReady = !!bridge();
      setText('bridgeState', state.bridgeReady ? 'Bridge ready' : 'Browser preview');
      log('H5 demo ready. Waiting JSBridge...');
      if (state.bridgeReady) {
        refreshState();
      }
    });
  </script>
</body>

</html>
